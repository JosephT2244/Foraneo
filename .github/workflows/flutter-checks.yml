name: Verificar app Flutter
on:
  push:
    branches: [main]
    paths: ['foraneo_flutter/**', '.github/workflows/flutter-checks.yml', 'tests/recipe-fixtures.json']
  pull_request:
    paths: ['foraneo_flutter/**', '.github/workflows/flutter-checks.yml', 'tests/recipe-fixtures.json']
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: foraneo_flutter
        run: flutter pub get
      - name: Analizar Dart
        working-directory: foraneo_flutter
        run: flutter analyze
      - name: Probar datos, recetas, cifrado y pantallas
        working-directory: foraneo_flutter
        run: flutter test
